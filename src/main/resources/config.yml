# Set the time between messages in whole seconds.
# Wait one interval before the first message. Timing uses 20 server ticks per second.
interval-seconds: 300

# Use MiniMessage only. Do not use legacy color codes such as &a or section-sign codes.
# Set prefix to '' to omit it. Include a trailing space if needed.
# Example: prefix: '<gold>[Announcer]</gold> '
prefix: ''

# Add messages in the order you want to send them. Repeat after the last message.
# Set messages to [] to disable announcements.
# Run /announcer reload after you change this file.
messages:
  - '<green>Welcome to the server!</green>'
  - '<yellow>Please be kind to other players.</yellow>'
